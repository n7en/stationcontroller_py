name: Strip simulator from main

# Runs when a PR is merged into main.
# If the simulator/ directory was included in the merge, this job removes it
# and pushes a cleanup commit so main stays free of dev-only tooling.

'on':
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  strip:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Remove simulator/ if present
        id: strip
        run: |
          if [ -d simulator ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r simulator/
            git commit -m "chore: strip dev-only simulator from main [skip ci]"
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push cleanup commit
        if: steps.strip.outputs.removed == 'true'
        run: git push origin main
