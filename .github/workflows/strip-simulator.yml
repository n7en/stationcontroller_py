name: Main branch cleanup

# Runs when a PR is merged into main.
# Performs two cleanup tasks in a single commit:
#   1. Removes simulator/ (dev-only tooling that should not ship in main)
#   2. Rewrites branch-specific install URLs from /dev/ to /main/ in README
#      and install scripts, so one-liner instructions are always correct.

'on':
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Strip simulator and fix branch refs
        id: cleanup
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          changed=false

          # 1. Remove simulator/ if present
          if [ -d simulator ]; then
            git rm -r simulator/
            changed=true
          fi

          # 2. Rewrite /dev/install → /main/install in docs and scripts
          for f in README.md install.sh install.ps1; do
            if [ -f "$f" ]; then
              sed -i 's|stationcontroller_py/dev/install\.|stationcontroller_py/main/install.|g' "$f"
              if ! git diff --quiet "$f"; then
                git add "$f"
                changed=true
              fi
            fi
          done

          if [ "$changed" = true ]; then
            git commit -m "chore: post-merge cleanup (strip simulator, fix branch refs) [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push cleanup commit
        if: steps.cleanup.outputs.changed == 'true'
        run: git push origin main
