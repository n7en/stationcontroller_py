  #   action:
  #     type: set_radio_power
  #     watts: 5.0

  # Example: switch to 40m WSPR frequency when the clock sensor crosses midnight.
  #
  # - name: "switch_40m_wspr"
  #   tier: configuration
  #   priority: 40
  #   description: "Tune to 40m WSPR at midnight"
  #   trigger:
  #     - type: manual
  #   action:
  #     type: tune_radio
  #     frequency_hz: 7038600
  #     mode: USB
  #     bandwidth_hz: 3000

  # Example: sequence of actions — engage amp relay, then reduce TX power.
  #
