  #   tier: configuration
  #   priority: 70
  #   description: "Close amp relay and drop radio drive to 5 W"
  #   trigger:
  #     - type: manual
  #   action:
  #     type: sequence
  #     actions:
  #       - type: set_relay
  #         dcn_address: "01"
  #         relay_num: 3
  #         state: 1
