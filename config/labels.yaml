# Friendly name labels for hardware sensor keys.
#
# Format:  hardware_key: "Friendly Name"
#
# Hardware keys follow the pattern:  <device_name>_<sensor>
# where device_name matches the 'name' parameter in config/comms_config.yaml.
# All component indices are 0-based.
#
# Both the hardware key and the friendly name are accepted in:
#   - automation trigger / condition sensor references
#   - API queries
#   - UI displays (friendly name shown by default)
#
# Keys must be unique; labels must be unique.
# Labels may contain spaces and special characters.
#
# -- HF Coax Switch (#331) ----------------------------------------------------
# Device: CoaxSwitch(name="coax", address="02", ...)
#
labels:
  coax_port_0: "20m Yagi"
  coax_port_1: "40m Dipole"
  coax_port_2: "80m Inverted-V"
  coax_port_3: "160m Vertical"
  coax_active_port: "HF Active Port"

# -- VHF Coax Relay (#332) ----------------------------------------------------
# Device: VHFCoaxRelay(name="vhf", address="05", ...)
#
  vhf_relay: "2m/70cm Relay"
  vhf_nc: "2m/70cm NC Port"
  vhf_no: "2m/70cm NO Port"

# -- Antenna Relay Module (#361) ----------------------------------------------
# Device: AntennaRelayModule(name="ant", address="06", ...)
#
  ant_relay_0: "Amp Bypass"
  ant_relay_1: "Low Pass Filter"
  ant_relay_2: "Antenna Tuner"
  ant_relay_3: "Transverter"
  ant_relay_4: "Relay 4"
  ant_relay_5: "Relay 5"
  ant_relay_6: "Relay 6"
  ant_relay_7: "Relay 7"

# -- GPIO Module (#321) -------------------------------------------------------
# Device: GPIOModule(name="gpio", address="01", ...)
# Uncomment and rename to match your wiring.
